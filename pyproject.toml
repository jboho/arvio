[project]
name = "arvio"
version = "0.2.0"
description = "Label eval items by hand, one at a time, with the judge hidden until the session ends"
readme = "README.md"
license = "MIT AND OFL-1.1"
license-files = ["LICENSE", "src/arvio/static/fonts/OFL.txt"]
requires-python = ">=3.11"
authors = [{ name = "Jonathan Boho" }]
dependencies = []

[project.scripts]
arvio = "arvio.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
